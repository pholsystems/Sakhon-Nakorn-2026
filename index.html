<style>
/* Layout: sticky title bar, one scrolling timeline per day, fixed bottom tab bar (3 days + info). */
:root {
  --ink: #172033;

  --paper: #f1f4f7;
  --card: #ffffff;
  --line: #d9dfe7;
  --indigo: #22346b;
  --indigo-soft: #e4e9f6;
  --lake: #17707f;
  --ok: #1d7a46;
  --ok-soft: #e0f1e7;
  --warn: #9a5b00;
  --warn-soft: #fbefd5;
  --bad: #a8321f;
  --bad-soft: #f8e1dc;
  --font: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8ecf3; --muted: #9aa5b8; --paper: #10151f; --card: #19202d; --line: #2b3546;
    --indigo: #9fb2f0; --indigo-soft: #222c4a; --lake: #55b9c9;
    --ok: #62c68b; --ok-soft: #17301f; --warn: #e6b04f; --warn-soft: #36290f; --bad: #f08a77; --bad-soft: #3a1c17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e8ecf3; --muted: #9aa5b8; --paper: #10151f; --card: #19202d; --line: #2b3546;
  --indigo: #9fb2f0; --indigo-soft: #222c4a; --lake: #55b9c9;
  --ok: #62c68b; --ok-soft: #17301f; --warn: #e6b04f; --warn-soft: #36290f; --bad: #f08a77; --bad-soft: #3a1c17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font);
  font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; }
a { color: var(--indigo); }
:focus-visible { outline: 3px solid var(--lake); outline-offset: 2px; }

header {
  position: sticky; top: 0; z-index: 5; background: var(--indigo); color: #fff;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
}
:root[data-theme="dark"] header { background: #1b2540; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) header { background: #1b2540; } }
header h1 { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.3; }
header p { margin: 0; font-size: 14px; opacity: .85; }

main { padding: 14px 16px 24px; max-width: 640px; margin: 0 auto; }
.daytitle { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin: 4px 0 4px; }
.daytitle h2 { margin: 0; font-size: 20px; font-weight: 700; }
.daytitle span { color: var(--muted); font-size: 14px; }
.theme { margin: 0 0 12px; padding: 8px 12px; border-left: 4px solid var(--lake); background: var(--card); border-radius: 0 8px 8px 0; font-size: 15px; }

.toolbar { display: flex; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; }
.chip {
  min-height: 40px; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--line);
  background: var(--card); cursor: pointer; font-size: 14px; font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--indigo); color: #fff; border-color: var(--indigo); }
:root[data-theme="dark"] .chip[aria-pressed="true"] { color: #10151f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #10151f; } }

.progress { font-size: 14px; color: var(--muted); margin-left: auto; align-self: center; font-variant-numeric: tabular-nums; }

.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.slot { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; }
.time { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; color: var(--muted); padding-top: 12px; line-height: 1.25; }
.time small { display: block; font-weight: 400; font-size: 13px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0;
  border-left: 5px solid var(--line);
}
.slot[data-kind="go"] .card { border-left-color: var(--indigo); }
.slot[data-kind="eat"] .card { border-left-color: var(--warn); }
.slot[data-kind="move"] .card { border-left-color: var(--muted); }
.slot[data-kind="rest"] .card { border-left-color: var(--lake); }
.slot.now .card { box-shadow: 0 0 0 3px var(--lake); }
.slot.done .card { opacity: .6; }
.slot.done .title { text-decoration: line-through; }
.head { display: flex; align-items: flex-start; gap: 10px; }
.head input[type=checkbox] { width: 24px; height: 24px; margin: 2px 0 0; flex: none; accent-color: var(--indigo); }
.title { font-size: 17px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.sub { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 10px; margin-bottom: 4px; background: var(--indigo-soft); color: var(--indigo); }
.slot[data-kind="eat"] .tag { background: var(--warn-soft); color: var(--warn); }
.slot[data-kind="move"] .tag { background: var(--line); color: var(--muted); }
.slot[data-kind="rest"] .tag { background: var(--ok-soft); color: var(--ok); }
.why { margin: 4px 0 4px; font-size: 15px; color: var(--ink); }
.leg { margin: -2px 0 0; padding-left: 66px; font-size: 14px; }
.leg a { display: inline-flex; align-items: center; min-height: 40px; color: var(--indigo); font-weight: 600; text-decoration: none; border-bottom: 1px dashed var(--indigo); }
.field { display: grid; gap: 6px; margin: 6px 0 10px; font-size: 14px; color: var(--muted); }
.field input, .field textarea { font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
.field textarea { min-height: 64px; resize: vertical; }
.embed { width: 100%; height: 280px; border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; background: var(--paper); }
.total { font-variant-numeric: tabular-nums; }
.note { margin: 6px 0 0; font-size: 15px; }
.nowflag { display: inline-block; font-size: 12px; font-weight: 700; color: #fff; background: var(--lake); padding: 1px 8px; border-radius: 10px; margin-left: 6px; vertical-align: 1px; }
:root[data-theme="dark"] .nowflag { color: #10151f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nowflag { color: #10151f; } }

.badge { display: inline-block; font-size: 13px; font-weight: 600; padding: 1px 9px; border-radius: 10px; font-variant-numeric: tabular-nums; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }

.opt { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.opt:first-of-type { margin-top: 8px; }
.more { margin-top: 8px; }
.more summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; color: var(--indigo); font-weight: 600; font-size: 15px; }
dl { margin: 4px 0 8px; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 4px 10px; font-size: 15px; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.btn {

:root[data-theme="dark"] .btn { color: #10151f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #10151f; } }
.btn.alt { background: transparent; color: var(--indigo); }

nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr);

nav button { min-height: 60px; background: none; border: 0; cursor: pointer; padding: 6px 2px; font-size: 14px; color: var(--muted); border-top: 3px solid transparent; }
nav button b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
nav button[aria-current="page"] { color: var(--indigo); border-top-color: var(--indigo); font-weight: 600; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 0 0 12px; }
.panel h3 { margin: 0 0 6px; font-size: 17px; }
.panel p { margin: 0 0 8px; font-size: 15px; }
.panel ul { margin: 0; padding-left: 20px; font-size: 15px; display: grid; gap: 4px; }
.panel.alert { border-left: 5px solid var(--bad); }
.panel.ask { border-left: 5px solid var(--warn); }
table.sched { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
table.sched th, table.sched td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.sched th { color: var(--muted); font-weight: 500; font-size: 14px; }
.reset { margin-top: 4px; }
@media (prefers-reduced-motion: no-preference) { .slot.now .card { transition: box-shadow .2s; } }
</style>
</head>

const TAG = { go: "เที่ยว", eat: "กิน", move: "เดินทาง", rest: "พัก" };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mapUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const telUrl = n => "tel:" + n.replace(/\s/g, "");
const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };

/* ---------- state ---------- */
let done = {};
try { done = JSON.parse(localStorage.getItem("sakon-done") || "{}"); } catch (e) { done = {}; }
let onlyEat = false;
const save = () => { try { localStorage.setItem("sakon-done", JSON.stringify(done)); } catch (e) {} };

function bkkNow() {
  const f = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Bangkok", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
  const g = t => f.find(x => x.type === t).value;
  return { date: g("year") + "-" + g("month") + "-" + g("day"), min: (Number(g("hour")) % 24) * 60 + Number(g("minute")) };
}

function hoursFor(p, day) {
  if (p.hoursText) return { text: p.hoursText, state: "info" };
  if (!p.hours) return null;
  if (p.closedDow && p.closedDow.includes(day.dow)) return { text: "ปิดวันนี้", state: "bad" };
  const h = (p.weekendHours && (day.dow === 6 || day.dow === 0)) ? p.weekendHours : p.hours;
  return { text: "เปิด " + h[0] + "–" + h[1] + " น.", state: "ok", range: h };
}

function badge(p, day, slotStart) {
  const h = hoursFor(p, day);
  if (!h) return "";
  if (h.state === "info") return '<span class="badge warn">' + esc(h.text) + "</span>";
  let cls = h.state, text = h.text;
  if (h.range && slotStart) {
    const ok = mins(slotStart) >= mins(h.range[0]) && mins(slotStart) < mins(h.range[1]);
    if (!ok) { cls = "warn"; text += " (เวลาแวะอยู่นอกเวลาทำการ)"; }
  }
  return '<span class="badge ' + cls + '">' + esc(text) + "</span>";
}

function placeBody(id, day, slotStart) {
  const p = P[id];
  const rows = [];
  rows.push(["ที่อยู่", esc(p.addr)]);
  const h = hoursFor(p, day);
  if (p.hoursText) rows.push(["เวลา", esc(p.hoursText)]);
  if (p.tel) rows.push(["โทร", p.tel.map(t => '<a href="' + telUrl(t) + '">' + esc(t) + "</a>").join("<br>")]);
  if (p.info) rows.push(["เด่น", esc(p.info)]);
  if (p.ll) rows.push(["พิกัด", p.ll[0].toFixed(4) + ", " + p.ll[1].toFixed(4)]);
  const dest = p.ll ? p.ll.join(",") : p.q;
  const btns = '<a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest) + '" target="_blank" rel="noopener">นำทาง</a>' +
    '<a class="btn alt" href="' + mapUrl(p.q) + '" target="_blank" rel="noopener">ดูรูปและรีวิว</a>' +
    (p.ll ? '<a class="btn alt" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + p.ll.join(",") + '" target="_blank" rel="noopener">Street View</a>' : "") +
    (p.tel ? '<a class="btn alt" href="' + telUrl(p.tel[0]) + '">โทร ' + esc(p.tel[0]) + "</a>" : "") +
    (p.link ? '<a class="btn alt" href="' + esc(p.link) + '" target="_blank" rel="noopener">' + esc(p.linkLabel || "ลิงก์") + "</a>" : "");
  const map = '<button type="button" class="btn alt" data-embed="' + esc(p.q) + '" style="width:100%;margin-top:8px">แสดงแผนที่และรูปในหน้านี้</button><div class="embedbox"></div>';
  return { badge: badge(p, day, slotStart), html: "<dl>" + rows.map(r => "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>").join("") + "</dl>" + '<div class="btns">' + btns + "</div>" + map };
}


/* ---------- notes, cost, route links ---------- */
let extra = {};
try { extra = JSON.parse(localStorage.getItem("sakon-extra") || "{}"); } catch (e) { extra = {}; }
const saveExtra = () => { try { localStorage.setItem("sakon-extra", JSON.stringify(extra)); } catch (e) {} };
const baht = n => Number(n || 0).toLocaleString("th-TH");
function dayTotal(day) { return day.items.reduce((t, _, i) => t + (Number((extra[day.id + i] || {}).c) || 0), 0); }
function noteBlock(key) {
  const x = extra[key] || {};
  return '<details class="more"><summary>บันทึกและค่าใช้จ่าย</summary>' +
    '<label class="field">ค่าใช้จ่ายที่นี่ (บาท)<input type="number" inputmode="numeric" min="0" data-c="' + key + '" value="' + (x.c || "") + '"></label>' +
    '<label class="field">บันทึก<textarea data-n="' + key + '">' + esc(x.n || "") + "</textarea></label></details>";
}
function located(it) { return it.p ? it.p : (it.opts && it.opts.length === 1 ? it.opts[0] : null); }
function dirUrl(from, to) {
  return "https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=" + encodeURIComponent(P[from].q) + "&destination=" + encodeURIComponent(P[to].q);
}
function legRow(day, i) {
  const a = located(day.items[i]);
  if (!a) return "";
  let j = i + 1;
  while (j < day.items.length && !located(day.items[j])) j++;
  if (j >= day.items.length) return "";
  const b = located(day.items[j]);
  if (a === b) return "";
  if (onlyEat && day.items[i].kind !== "eat") return "";
  return '<li class="leg"><a href="' + dirUrl(a, b) + '" target="_blank" rel="noopener">ดูเวลาเดินทางไป ' + esc(P[b].name) + "</a></li>";
}
function routeUrl(day) {
  const seq = [];
  day.items.forEach(it => { const p = located(it); if (p && seq[seq.length - 1] !== p) seq.push(p); });
  if (seq.length < 2) return "";
  const qs = seq.map(id => encodeURIComponent(P[id].q));
  return "https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=" + qs[0] + "&destination=" + qs[qs.length - 1] +
    (qs.length > 2 ? "&waypoints=" + qs.slice(1, -1).join("%7C") : "");
}

function renderDay(day) {
  const n = bkkNow();
  const isToday = n.date === day.date;
  let nowIdx = -1;
  if (isToday) {
    day.items.forEach((it, i) => { if (nowIdx < 0 && n.min < mins(it.e)) nowIdx = i; });
  }
  const items = day.items.map((it, i) => ({ it, i })).filter(x => !onlyEat || x.it.kind === "eat");
  const total = day.items.length, dn = day.items.filter((_, i) => done[day.id + i]).length;
  let html = '<div class="daytitle"><h2>' + esc(day.label) + "</h2><span>" + (day.dow === 4 ? "ไม่มีรถเช่า" : "มีรถเช่า") + "</span></div>";
  html += '<p class="theme">' + esc(day.theme) + "</p>";
  const ru = routeUrl(day);
  if (ru) html += '<div class="btns" style="margin:0 0 12px"><a class="btn" href="' + ru + '" target="_blank" rel="noopener">เปิดเส้นทางทั้งวันใน Google Maps</a></div>';
  html += '<div class="toolbar"><button class="chip" id="eatf" aria-pressed="' + onlyEat + '">เฉพาะมื้ออาหาร</button><span class="progress">เสร็จแล้ว ' + dn + "/" + total + '</span></div><p class="note total">ค่าใช้จ่ายรวมวันนี้ <b id="dtotal">' + baht(dayTotal(day)) + "</b> บาท</p>";
  html += '<ol class="timeline">';
  items.forEach(({ it, i }) => {
    const key = day.id + i;
    const places = it.opts ? it.opts : (it.p ? [it.p] : []);
    let inner = "";
    const sub = [];
    if (it.opts) {
      inner += it.opts.map(id => {
        const b = placeBody(id, day, it.s);
        return '<div class="opt"><div class="title">' + esc(P[id].name) + '</div>' + (P[id].en ? '<div class="sub">' + esc(P[id].en) + "</div>" : "") + (P[id].why ? '<p class="why">' + esc(P[id].why) + "</p>" : "") + b.badge +
          '<details class="more"><summary>รายละเอียด</summary>' + b.html + "</details></div>";
      }).join("");
    } else if (it.p) {
      const b = placeBody(it.p, day, it.s);
      sub.push(P[it.p].name + (P[it.p].en ? "" : ""));
      inner += (P[it.p].en ? '<div class="sub">' + esc(P[it.p].en) + "</div>" : "") + (P[it.p].why ? '<p class="why">' + esc(P[it.p].why) + "</p>" : "") + b.badge +
        '<details class="more"><summary>รายละเอียด รูป และนำทาง</summary>' + b.html + "</details>";
    }
    const cls = "slot" + (done[key] ? " done" : "") + (i === nowIdx ? " now" : "");
    html += '<li class="' + cls + '" data-kind="' + it.kind + '" id="' + key + '">' +
      '<div class="time">' + it.s + "<small>ถึง " + it.e + "</small></div>" +
      '<div class="card"><span class="tag">' + TAG[it.kind] + "</span>" + (i === nowIdx ? '<span class="nowflag">ตอนนี้</span>' : "") +
      '<div class="head"><input type="checkbox" data-k="' + key + '" id="c' + key + '" aria-label="ทำแล้ว: ' + esc(it.title) + '"' + (done[key] ? " checked" : "") + '>' +
      '<label for="c' + key + '" class="title">' + esc(it.title) + "</label></div>" +
      (it.note ? '<p class="note">' + esc(it.note) + "</p>" : "") + inner + noteBlock(key) + "</div></li>" + legRow(day, i);
  });
  html += "</ol>";
  return html;
}

/* ---------- routing on hash: #d1 #d2 #d3 #info ---------- */
const VIEWS = ["d1", "d2", "d3", "info"];
function pickStart() {
  const n = bkkNow();
  const hit = DAYS.find(d => d.date === n.date);
  return hit ? hit.id : "d1";
}
function show() {
  let v = location.hash.replace("#", "");
  if (!VIEWS.includes(v)) v = pickStart();
  const day = DAYS.find(d => d.id === v);
  $("#app").innerHTML = day ? renderDay(day) : renderInfo();
  $("#tabs").innerHTML = DAYS.map(d => '<button data-v="' + d.id + '"' + (d.id === v ? ' aria-current="page"' : "") + ">" + d.short + "<b>" + d.num + "</b></button>").join("") +
    '<button data-v="info"' + (v === "info" ? ' aria-current="page"' : "") + "><b>ข้อมูล</b>ทริป</button>";
  const eatf = $("#eatf");
  if (eatf) eatf.onclick = () => { onlyEat = !onlyEat; show(); };
  const reset = $("#reset");
  if (reset) reset.onclick = () => { done = {}; save(); reset.textContent = "ล้างแล้ว"; };
  document.querySelectorAll("input[data-k]").forEach(cb => cb.onchange = () => {
    done[cb.dataset.k] = cb.checked; if (!cb.checked) delete done[cb.dataset.k]; save();
    const y = scrollY; show(); scrollTo(0, y);
  });
  document.querySelectorAll("input[data-c]").forEach(el => el.onchange = () => {
    const k = el.dataset.c; (extra[k] = extra[k] || {}).c = el.value; saveExtra();
    const d = DAYS.find(x => x.id === (location.hash.replace("#", "") || pickStart())) || DAYS[0];
    const t = $("#dtotal"); if (t) t.textContent = baht(dayTotal(d));
  });
  document.querySelectorAll("textarea[data-n]").forEach(el => el.onchange = () => {
    const k = el.dataset.n; (extra[k] = extra[k] || {}).n = el.value; saveExtra();
  });
  document.querySelectorAll("button[data-embed]").forEach(bt => bt.onclick = () => {
    const box = bt.nextElementSibling;
    if (box.firstChild) { box.innerHTML = ""; bt.textContent = "แสดงแผนที่และรูปในหน้านี้"; return; }
    box.innerHTML = '<iframe class="embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="แผนที่ Google" src="https://www.google.com/maps?q=' + encodeURIComponent(bt.dataset.embed) + '&hl=th&z=15&output=embed"></iframe>';
    bt.textContent = "ซ่อนแผนที่";
  });
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { location.hash = b.dataset.v; scrollTo(0, 0); });
  const nowEl = document.querySelector(".slot.now");
  if (nowEl) nowEl.scrollIntoView({ block: "center" });
}
window.addEventListener("hashchange", show);
show();
setInterval(() => { if (!document.hidden && !document.querySelector("details[open]") && !/INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || "")) { const y = scrollY; show(); scrollTo(0, y); } }, 60000);
</script>
</body>
